# AMD eGPU over USB4/Thunderbolt — MS-S1 Max + DEG2 + R9700 (gfx1201 / RDNA4)
# Staged copy. Install to /etc/modprobe.d/amd-egpu.conf
#
# Sources:
#   - cpburnz "Strix Halo mixed eGPUs" guide (same hw: MS-S1 Max + DEG2 + USB4)
#   - patikoija/linux-thunderbolt-egpu (RDNA4 over Thunderbolt)
#
# `mes=0` is deliberately NOT set. That workaround came from the cpburnz setup,
# whose AMD card is an RX 7900 XTX (gfx1100 / RDNA2). RDNA4 needs MES, and the
# option is global, so it also degrades the gfx1151 iGPU. It is the likely
# source of the repeated "Timeout waiting for VM flush ACK" messages.

# The AMD card must initialize AFTER the thunderbolt/USB4 link is up.
softdep amdgpu pre: thunderbolt

# Thunderbolt cannot provide the 16 GB+ address space Resizable BAR asks for.
options amdgpu rebar=0

# Idle Power Save crashes the DMCUB firmware on Navi 48 / DCN 4.0.1.
options amdgpu dcdebugmask=0x800

# PCIe hot-reset does not propagate through Thunderbolt bridges: a reset attempt
# corrupts the link and any later MMIO read hard-locks the CPU.
options amdgpu gpu_recovery=0

# Thunderbolt latency makes the 10 s default far too aggressive.
options amdgpu lockup_timeout=60000

# Runtime PM over a Thunderbolt tunnel is unreliable.
options amdgpu runpm=0
